<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .bg { fill: #fbfaf6; }
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 42px; font-weight: 800; fill: #211713; }
      .subtitle { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #62544d; }
      .section { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 25px; font-weight: 800; fill: #2b201c; }
      .node-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 800; fill: #2b201c; }
      .node-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #5d5049; }
      .small { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #62564f; }
      .tiny { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #685b54; }
      .layer { fill: #fffdf9; stroke: #d6c7ba; stroke-width: 2; rx: 24; }
      .problem { fill: #fff7eb; stroke: #e3c8a9; stroke-width: 2; rx: 22; }
      .experience { fill: #fff4ee; stroke: #ecbca7; stroke-width: 2; rx: 22; }
      .backend { fill: #f4faff; stroke: #b8d4e8; stroke-width: 2; rx: 22; }
      .agent { fill: #f5fff7; stroke: #bdddc5; stroke-width: 2; rx: 22; }
      .memory { fill: #fff8fb; stroke: #e8bfd0; stroke-width: 2; rx: 22; }
      .dark { fill: #2d1f19; stroke: #2d1f19; rx: 22; }
      .dark-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 800; fill: #fff6eb; }
      .dark-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #ffe6d6; }
      .badge { fill: #ffffff; stroke: #d7c4b4; stroke-width: 1.5; rx: 14; }
      .badge-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; fill: #4c403a; }
      .arrow-o { stroke: #ff6238; stroke-width: 4; fill: none; }
      .arrow-b { stroke: #3f7fb6; stroke-width: 4; fill: none; }
      .arrow-g { stroke: #4d9961; stroke-width: 4; fill: none; }
      .arrow-p { stroke: #c55f86; stroke-width: 4; fill: none; }
      .arrow-k { stroke: #6d4d40; stroke-width: 4; fill: none; stroke-dasharray: 10 8; }
      .arrow-label { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #554942; }
      .contrib { fill: #2d1f19; rx: 17; }
      .contrib-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 800; fill: #fff5ea; }
    </style>
    <marker id="ao" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#ff6238"/>
    </marker>
    <marker id="ab" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#3f7fb6"/>
    </marker>
    <marker id="ag" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#4d9961"/>
    </marker>
    <marker id="ap" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#c55f86"/>
    </marker>
    <marker id="ak" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#6d4d40"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#533626" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect class="bg" width="1800" height="1180"/>

  <text x="72" y="66" class="title">LifePilot 饭点定了：可参与、可记忆、可复盘的 AI 饭点决策系统</text>
  <text x="72" y="104" class="subtitle">把“今天吃什么”从一次性问答，改造成用户参与选择、系统持续学习的闭环</text>

  <!-- Problem -->
  <rect x="72" y="132" width="1656" height="116" class="layer" filter="url(#shadow)"/>
  <text x="104" y="171" class="section">问题定义：用户不缺商家信息，缺的是当下场景里的决策支持</text>
  <rect x="104" y="194" width="280" height="36" class="badge"/>
  <text x="126" y="218" class="badge-text">饿了，但说不清想吃什么</text>
  <rect x="420" y="194" width="280" height="36" class="badge"/>
  <text x="442" y="218" class="badge-text">不想被 AI 单点替我决定</text>
  <rect x="736" y="194" width="300" height="36" class="badge"/>
  <text x="758" y="218" class="badge-text">不想看冷冰冰的商家列表</text>
  <rect x="1072" y="194" width="286" height="36" class="badge"/>
  <text x="1094" y="218" class="badge-text">希望个性化透明可控</text>
  <rect x="1394" y="194" width="280" height="36" class="badge"/>
  <text x="1416" y="218" class="badge-text">每次选择都让下次更懂我</text>

  <!-- Experience layer -->
  <rect x="72" y="282" width="1656" height="210" class="layer"/>
  <text x="104" y="322" class="section">一、用户体验层：滑卡不是装饰，而是低成本表达偏好的交互实验</text>

  <rect x="112" y="350" width="245" height="100" class="experience" filter="url(#shadow)"/>
  <text x="136" y="386" class="node-title">问小汪</text>
  <text x="136" y="418" class="node-text">自然语言表达当下状态</text>

  <rect x="405" y="350" width="245" height="100" class="experience" filter="url(#shadow)"/>
  <text x="429" y="386" class="node-title">方向滑卡</text>
  <text x="429" y="418" class="node-text">先选方向，再缩小问题</text>

  <rect x="698" y="350" width="245" height="100" class="experience" filter="url(#shadow)"/>
  <text x="722" y="386" class="node-title">商户滑卡</text>
  <text x="722" y="418" class="node-text">视频、套餐、AI 推荐语</text>

  <rect x="991" y="350" width="245" height="100" class="experience" filter="url(#shadow)"/>
  <text x="1015" y="386" class="node-title">最终确认</text>
  <text x="1015" y="418" class="node-text">决策权交还给用户</text>

  <rect x="1284" y="350" width="245" height="100" class="experience" filter="url(#shadow)"/>
  <text x="1308" y="386" class="node-title">小汪日记本</text>
  <text x="1308" y="418" class="node-text">小结、画像、待确认记忆</text>

  <path d="M357 400 C374 400 388 400 405 400" class="arrow-o" marker-end="url(#ao)"/>
  <path d="M650 400 C667 400 681 400 698 400" class="arrow-o" marker-end="url(#ao)"/>
  <path d="M943 400 C960 400 974 400 991 400" class="arrow-o" marker-end="url(#ao)"/>
  <path d="M1236 400 C1253 400 1267 400 1284 400" class="arrow-o" marker-end="url(#ao)"/>

  <rect x="1562" y="350" width="126" height="100" class="dark" filter="url(#shadow)"/>
  <text x="1588" y="386" class="dark-title">用户</text>
  <text x="1584" y="416" class="dark-text">保留 / 划掉</text>
  <text x="1584" y="440" class="dark-text">确认 / 拒绝</text>

  <!-- Runtime layer -->
  <rect x="72" y="526" width="800" height="270" class="layer"/>
  <text x="104" y="566" class="section">二、产品后端：稳定执行规则与排序</text>

  <rect x="112" y="598" width="210" height="92" class="backend"/>
  <text x="136" y="634" class="node-title">会话账本</text>
  <text x="136" y="666" class="node-text">记录需求与滑卡轨迹</text>

  <rect x="362" y="598" width="210" height="92" class="backend"/>
  <text x="386" y="634" class="node-title">硬约束过滤</text>
  <text x="386" y="666" class="node-text">菜系、预算、辣度、人数</text>

  <rect x="612" y="598" width="210" height="92" class="backend"/>
  <text x="636" y="634" class="node-title">特征化排序</text>
  <text x="636" y="666" class="node-text">scoring_features 可解释</text>

  <rect x="238" y="714" width="210" height="52" class="backend"/>
  <text x="262" y="748" class="node-text">商户优缺点解释</text>

  <rect x="496" y="714" width="210" height="52" class="backend"/>
  <text x="520" y="748" class="node-text">记忆 CRUD 与数据校验</text>

  <path d="M322 644 C337 644 347 644 362 644" class="arrow-b" marker-end="url(#ab)"/>
  <path d="M572 644 C587 644 597 644 612 644" class="arrow-b" marker-end="url(#ab)"/>
  <path d="M717 690 C682 710 625 718 566 724" class="arrow-b" marker-end="url(#ab)"/>
  <path d="M467 690 C438 706 397 714 355 724" class="arrow-b" marker-end="url(#ab)"/>

  <rect x="928" y="526" width="800" height="270" class="layer"/>
  <text x="960" y="566" class="section">三、Agent Runtime：OpenClaw workspace 提供协作能力</text>

  <rect x="968" y="598" width="210" height="92" class="agent"/>
  <text x="992" y="634" class="node-title">小汪人格</text>
  <text x="992" y="666" class="node-text">规则、语气、产品边界</text>

  <rect x="1218" y="598" width="210" height="92" class="agent"/>
  <text x="1242" y="634" class="node-title">Skills</text>
  <text x="1242" y="666" class="node-text">滑卡、记忆、商户理解</text>

  <rect x="1468" y="598" width="210" height="92" class="agent"/>
  <text x="1492" y="634" class="node-title">Gateway</text>
  <text x="1492" y="666" class="node-text">通过 API 协作</text>

  <rect x="1096" y="714" width="210" height="52" class="agent"/>
  <text x="1120" y="748" class="node-text">Memory Intelligence</text>

  <rect x="1354" y="714" width="210" height="52" class="agent"/>
  <text x="1378" y="748" class="node-text">Ark / LLM 解释</text>

  <path d="M1178 644 C1193 644 1203 644 1218 644" class="arrow-g" marker-end="url(#ag)"/>
  <path d="M1428 644 C1443 644 1453 644 1468 644" class="arrow-g" marker-end="url(#ag)"/>
  <path d="M1323 690 C1294 706 1253 714 1211 724" class="arrow-g" marker-end="url(#ag)"/>
  <path d="M1428 724 C1443 724 1339 724 1354 724" class="arrow-g" marker-end="url(#ag)"/>

  <path d="M872 662 C900 662 900 662 928 662" class="arrow-k" marker-end="url(#ak)"/>
  <text x="882" y="642" class="arrow-label">API 边界：Agent 不直接改运行数据</text>

  <!-- Memory layer -->
  <rect x="72" y="832" width="1656" height="210" class="layer"/>
  <text x="104" y="872" class="section">四、Memory Intelligence：借鉴 Claude Code dreaming 思想，但统一为可治理的记忆加工链路</text>

  <rect x="112" y="906" width="210" height="88" class="memory"/>
  <text x="136" y="940" class="node-title">行为证据</text>
  <text x="136" y="970" class="node-text">聊天、滑卡、确认</text>

  <rect x="362" y="906" width="210" height="88" class="memory"/>
  <text x="386" y="940" class="node-title">短期观察</text>
  <text x="386" y="970" class="node-text">今天似乎在意什么</text>

  <rect x="612" y="906" width="210" height="88" class="memory"/>
  <text x="636" y="940" class="node-title">待确认记忆</text>
  <text x="636" y="970" class="node-text">不擅自写长期偏好</text>

  <rect x="862" y="906" width="210" height="88" class="memory"/>
  <text x="886" y="940" class="node-title">用户确认</text>
  <text x="886" y="970" class="node-text">确认、编辑、拒绝</text>

  <rect x="1112" y="906" width="210" height="88" class="memory"/>
  <text x="1136" y="940" class="node-title">长期偏好</text>
  <text x="1136" y="970" class="node-text">稳定画像与偏好</text>

  <rect x="1362" y="906" width="250" height="88" class="memory"/>
  <text x="1386" y="940" class="node-title">推荐信号</text>
  <text x="1386" y="970" class="node-text">参与下一次排序和解释</text>

  <path d="M322 950 C337 950 347 950 362 950" class="arrow-p" marker-end="url(#ap)"/>
  <path d="M572 950 C587 950 597 950 612 950" class="arrow-p" marker-end="url(#ap)"/>
  <path d="M822 950 C837 950 847 950 862 950" class="arrow-p" marker-end="url(#ap)"/>
  <path d="M1072 950 C1087 950 1097 950 1112 950" class="arrow-p" marker-end="url(#ap)"/>
  <path d="M1322 950 C1337 950 1347 950 1362 950" class="arrow-p" marker-end="url(#ap)"/>

  <path d="M1487 906 C1460 830 1190 800 880 796 C560 792 292 772 236 690" class="arrow-g" marker-end="url(#ag)"/>
  <text x="1062" y="814" class="arrow-label">推荐信号回流到下一次排序</text>

  <!-- Contributions -->
  <rect x="72" y="1072" width="1656" height="72" class="layer"/>
  <rect x="120" y="1088" width="350" height="40" class="contrib"/>
  <text x="144" y="1114" class="contrib-text">贡献 1：人机协同滑卡决策</text>
  <rect x="500" y="1088" width="350" height="40" class="contrib"/>
  <text x="524" y="1114" class="contrib-text">贡献 2：内容化本地生活推荐</text>
  <rect x="880" y="1088" width="350" height="40" class="contrib"/>
  <text x="904" y="1114" class="contrib-text">贡献 3：透明记忆治理</text>
  <rect x="1260" y="1088" width="390" height="40" class="contrib"/>
  <text x="1284" y="1114" class="contrib-text">贡献 4：产品 runtime + Agent runtime</text>
</svg>
