<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 42px; font-weight: 800; fill: #211713; }
      .subtitle { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; fill: #62544d; }
      .section-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 27px; font-weight: 800; fill: #2b201c; }
      .node-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 800; fill: #2b201c; }
      .node-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; fill: #5d5049; }
      .small { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #645851; }
      .badge-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 17px; font-weight: 700; fill: #4c403a; }
      .caption { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #5a4d46; }
      .boundary { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #6a5a51; }
      .panel { fill: #fffdf9; stroke: #d6c7ba; stroke-width: 2; rx: 24; }
      .problem { fill: #fff7ea; stroke: #e0c3a4; stroke-width: 2; rx: 18; }
      .ux { fill: #fff4ee; stroke: #efbaa2; stroke-width: 2; rx: 20; }
      .product { fill: #f3faff; stroke: #b4d2e8; stroke-width: 2; rx: 20; }
      .agent { fill: #f4fff7; stroke: #b8dcc1; stroke-width: 2; rx: 20; }
      .memory { fill: #fff7fb; stroke: #e6bdd0; stroke-width: 2; rx: 20; }
      .dark { fill: #2d1f19; rx: 18; }
      .dark-title { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 800; fill: #fff7ec; }
      .dark-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; fill: #ffe8d9; }
      .badge { fill: #ffffff; stroke: #d4c0b1; stroke-width: 1.5; rx: 14; }
      .arrow { stroke: #ff6238; stroke-width: 4; fill: none; }
      .arrow-blue { stroke: #3f7fb6; stroke-width: 4; fill: none; }
      .arrow-green { stroke: #4d9961; stroke-width: 4; fill: none; }
      .arrow-pink { stroke: #c85e86; stroke-width: 4; fill: none; }
      .arrow-soft { stroke: #8c6758; stroke-width: 3; fill: none; stroke-dasharray: 9 8; }
      .contrib { fill: #2d1f19; rx: 16; }
      .contrib-text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 18px; font-weight: 800; fill: #fff5ea; }
    </style>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#ff6238"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#3f7fb6"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#4d9961"/>
    </marker>
    <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#c85e86"/>
    </marker>
    <marker id="arrow-soft" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#8c6758"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5a392b" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect class="bg" width="1800" height="1280"/>

  <text x="72" y="66" class="title">LifePilot 饭点定了：可参与、可记忆、可复盘的 AI 饭点决策系统</text>
  <text x="72" y="106" class="subtitle">把“今天吃什么”从一次性问答，改造成用户参与选择、系统持续学习的闭环</text>

  <!-- Problem definition -->
  <rect x="72" y="138" width="1656" height="118" class="panel" filter="url(#shadow)"/>
  <text x="104" y="178" class="section-title">问题定义：用户不缺商家信息，缺的是当下场景里的决策支持</text>

  <rect x="112" y="202" width="330" height="36" class="badge"/>
  <text x="134" y="226" class="badge-text">饿了，但说不清想吃什么</text>
  <rect x="488" y="202" width="330" height="36" class="badge"/>
  <text x="510" y="226" class="badge-text">不想被 AI 单点替我决定</text>
  <rect x="864" y="202" width="330" height="36" class="badge"/>
  <text x="886" y="226" class="badge-text">不想看冷冰冰的商家列表</text>
  <rect x="1240" y="202" width="330" height="36" class="badge"/>
  <text x="1262" y="226" class="badge-text">希望个性化透明、可编辑</text>

  <!-- User experience -->
  <rect x="72" y="292" width="1656" height="214" class="panel"/>
  <text x="104" y="334" class="section-title">一、用户体验层：滑卡是低成本表达偏好的交互机制</text>

  <rect x="112" y="368" width="245" height="92" class="ux" filter="url(#shadow)"/>
  <text x="136" y="402" class="node-title">问小汪</text>
  <text x="136" y="432" class="node-text">表达当下状态</text>

  <rect x="416" y="368" width="245" height="92" class="ux" filter="url(#shadow)"/>
  <text x="440" y="402" class="node-title">方向滑卡</text>
  <text x="440" y="432" class="node-text">先选方向</text>

  <rect x="720" y="368" width="245" height="92" class="ux" filter="url(#shadow)"/>
  <text x="744" y="402" class="node-title">商户滑卡</text>
  <text x="744" y="432" class="node-text">视频与推荐语</text>

  <rect x="1024" y="368" width="245" height="92" class="ux" filter="url(#shadow)"/>
  <text x="1048" y="402" class="node-title">最终确认</text>
  <text x="1048" y="432" class="node-text">用户保留决策权</text>

  <rect x="1328" y="368" width="245" height="92" class="ux" filter="url(#shadow)"/>
  <text x="1352" y="402" class="node-title">小汪日记本</text>
  <text x="1352" y="432" class="node-text">小结、画像、记忆</text>

  <path d="M357 414 L416 414" class="arrow" marker-end="url(#arrow-red)"/>
  <path d="M661 414 L720 414" class="arrow" marker-end="url(#arrow-red)"/>
  <path d="M965 414 L1024 414" class="arrow" marker-end="url(#arrow-red)"/>
  <path d="M1269 414 L1328 414" class="arrow" marker-end="url(#arrow-red)"/>

  <rect x="1598" y="368" width="92" height="92" class="dark" filter="url(#shadow)"/>
  <text x="1621" y="402" class="dark-title">用户</text>
  <text x="1614" y="432" class="dark-text">保留 / 划掉</text>
  <text x="1614" y="454" class="dark-text">确认 / 拒绝</text>

  <!-- Runtime panels -->
  <rect x="72" y="542" width="790" height="276" class="panel"/>
  <text x="104" y="584" class="section-title">二、产品运行层：稳定执行规则与排序</text>

  <rect x="112" y="620" width="210" height="92" class="product"/>
  <text x="136" y="654" class="node-title">会话账本</text>
  <text x="136" y="684" class="node-text">记录需求与轨迹</text>

  <rect x="366" y="620" width="210" height="92" class="product"/>
  <text x="390" y="654" class="node-title">硬约束过滤</text>
  <text x="390" y="684" class="node-text">菜系、预算、辣度</text>

  <rect x="620" y="620" width="210" height="92" class="product"/>
  <text x="644" y="654" class="node-title">特征化排序</text>
  <text x="644" y="684" class="node-text">可解释评分</text>

  <rect x="190" y="742" width="230" height="46" class="product"/>
  <text x="214" y="772" class="node-text">商户优缺点解释</text>

  <rect x="512" y="742" width="230" height="46" class="product"/>
  <text x="536" y="772" class="node-text">记忆校验与落库</text>

  <path d="M322 666 L366 666" class="arrow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M576 666 L620 666" class="arrow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M724 712 L658 742" class="arrow-blue" marker-end="url(#arrow-blue)"/>
  <path d="M470 712 L365 742" class="arrow-blue" marker-end="url(#arrow-blue)"/>

  <rect x="938" y="542" width="790" height="276" class="panel"/>
  <text x="970" y="584" class="section-title">三、智能体运行层：OpenClaw workspace 提供协作能力</text>

  <rect x="978" y="620" width="210" height="92" class="agent"/>
  <text x="1002" y="654" class="node-title">小汪人格</text>
  <text x="1002" y="684" class="node-text">规则、语气、边界</text>

  <rect x="1232" y="620" width="210" height="92" class="agent"/>
  <text x="1256" y="654" class="node-title">Skills</text>
  <text x="1256" y="684" class="node-text">滑卡、记忆、商户</text>

  <rect x="1486" y="620" width="210" height="92" class="agent"/>
  <text x="1510" y="654" class="node-title">Gateway</text>
  <text x="1510" y="684" class="node-text">通过 API 协作</text>

  <rect x="1074" y="742" width="260" height="46" class="agent"/>
  <text x="1098" y="772" class="node-text">Memory Intelligence</text>

  <rect x="1420" y="742" width="210" height="46" class="agent"/>
  <text x="1444" y="772" class="node-text">Ark / LLM 解释</text>

  <path d="M1188 666 L1232 666" class="arrow-green" marker-end="url(#arrow-green)"/>
  <path d="M1442 666 L1486 666" class="arrow-green" marker-end="url(#arrow-green)"/>
  <path d="M1320 712 L1250 742" class="arrow-green" marker-end="url(#arrow-green)"/>
  <path d="M1442 712 L1500 742" class="arrow-green" marker-end="url(#arrow-green)"/>

  <path d="M862 680 L938 680" class="arrow-soft" marker-end="url(#arrow-soft)"/>
  <text x="884" y="736" class="boundary">API 边界</text>
  <text x="842" y="756" class="boundary">不直接改运行数据</text>

  <!-- Memory pipeline -->
  <rect x="72" y="854" width="1656" height="226" class="panel"/>
  <text x="104" y="896" class="section-title">四、记忆智能：借鉴 Claude Code dreaming 思想，但统一为可治理的记忆加工链路</text>

  <rect x="112" y="934" width="210" height="88" class="memory"/>
  <text x="136" y="968" class="node-title">行为证据</text>
  <text x="136" y="998" class="node-text">聊天、滑卡、确认</text>

  <rect x="390" y="934" width="210" height="88" class="memory"/>
  <text x="414" y="968" class="node-title">短期观察</text>
  <text x="414" y="998" class="node-text">今天在意什么</text>

  <rect x="668" y="934" width="210" height="88" class="memory"/>
  <text x="692" y="968" class="node-title">待确认记忆</text>
  <text x="692" y="998" class="node-text">不擅自写长期偏好</text>

  <rect x="946" y="934" width="210" height="88" class="memory"/>
  <text x="970" y="968" class="node-title">用户确认</text>
  <text x="970" y="998" class="node-text">确认、编辑、拒绝</text>

  <rect x="1224" y="934" width="210" height="88" class="memory"/>
  <text x="1248" y="968" class="node-title">长期偏好</text>
  <text x="1248" y="998" class="node-text">稳定画像</text>

  <rect x="1502" y="934" width="190" height="88" class="memory"/>
  <text x="1526" y="968" class="node-title">推荐信号</text>
  <text x="1526" y="998" class="node-text">进入下次排序</text>

  <path d="M322 978 L390 978" class="arrow-pink" marker-end="url(#arrow-pink)"/>
  <path d="M600 978 L668 978" class="arrow-pink" marker-end="url(#arrow-pink)"/>
  <path d="M878 978 L946 978" class="arrow-pink" marker-end="url(#arrow-pink)"/>
  <path d="M1156 978 L1224 978" class="arrow-pink" marker-end="url(#arrow-pink)"/>
  <path d="M1434 978 L1502 978" class="arrow-pink" marker-end="url(#arrow-pink)"/>

  <rect x="1280" y="846" width="270" height="34" class="badge"/>
  <text x="1302" y="869" class="badge-text">推荐信号回流到下一次排序</text>

  <!-- Contributions -->
  <rect x="72" y="1116" width="1656" height="84" class="panel"/>
  <rect x="118" y="1138" width="350" height="40" class="contrib"/>
  <text x="142" y="1164" class="contrib-text">贡献 1：人机协同滑卡决策</text>
  <rect x="508" y="1138" width="350" height="40" class="contrib"/>
  <text x="532" y="1164" class="contrib-text">贡献 2：内容化本地生活推荐</text>
  <rect x="898" y="1138" width="350" height="40" class="contrib"/>
  <text x="922" y="1164" class="contrib-text">贡献 3：透明记忆治理</text>
  <rect x="1288" y="1138" width="390" height="40" class="contrib"/>
  <text x="1312" y="1164" class="contrib-text">贡献 4：产品运行层 + 智能体运行层</text>
</svg>
